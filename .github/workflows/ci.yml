name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syb
          POSTGRES_PASSWORD: syb_ci
          POSTGRES_DB: syb
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U syb -d syb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://syb:syb_ci@127.0.0.1:5433/syb
      # P2-03: a throwaway 32-byte key so connector tests can encrypt.
      # CI never holds a real connection secret.
      CONNECTOR_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # ffmpeg-static downloads its binary from GitHub releases during
        # install; when that host is down the whole install fails. Retry
        # without install scripts then: the ffmpeg tests skip themselves
        # (lib/content/edit ffmpegAvailable) and nothing else needs one.
        run: |
          npm ci || {
            echo "::warning::npm ci failed (likely the ffmpeg download); retrying without install scripts"
            npm ci --ignore-scripts
          }

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Apply migrations
        run: npm run db:migrate

      - name: Tests
        run: npm test

      - name: Lint question bank
        # Pure stdlib — the runner's system Python is enough.
        run: python3 scripts/lint_bank.py

      - name: Production build
        # What Vercel runs on deploy: a page that only breaks at build time
        # is caught here, before merge, not on the live site.
        run: npm run build
