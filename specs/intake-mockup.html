<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intake — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=Public+Sans:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EBEDEA;
  --card:#F6F7F5;
  --ink:#10201B;
  --slate:#64716C;
  --rule:#CFD5D1;
  --signal:#1B3FCC;
  --signal-wash:#E4E8FA;
  --settled:#3E6B57;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Public Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- frame ---------- */
.shell{min-height:100%;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:baseline;gap:16px;
  padding:18px 28px;border-bottom:1px solid var(--rule);
}
.wordmark{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em}
.topbar .meta{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--slate)}
.progress-rail{height:2px;background:var(--rule);position:relative}
.progress-fill{height:2px;background:var(--ink);width:0;transition:width .5s var(--ease)}

.stage{
  flex:1;display:grid;grid-template-columns:1fr minmax(360px,600px) 1fr;
  gap:28px;padding:32px 28px 48px;align-items:start;
}

/* ---------- side columns ---------- */
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.col-head{
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--slate);padding:0 2px 6px;border-bottom:1px solid var(--rule);margin-bottom:4px;
}
.chip{
  background:var(--card);border:1px solid var(--rule);border-radius:3px;
  padding:9px 11px;cursor:pointer;text-align:left;font:inherit;color:inherit;
  animation:settle .34s var(--ease) both;
}
.chip:hover{border-color:var(--slate)}
.chip:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.chip .q{font-size:12px;color:var(--slate);line-height:1.35;margin-bottom:3px}
.chip .a{font-size:14px;font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.chip .tag{
  font-family:var(--mono);font-size:10px;color:var(--slate);
  margin-top:6px;display:flex;gap:8px;align-items:center;
}
.dot{width:5px;height:5px;border-radius:50%;background:var(--settled);flex:none}
.dot.thin{background:var(--rule);border:1px solid var(--slate)}
.chip.flag{border-color:var(--signal);background:var(--signal-wash)}
.chip.flag .tag{color:var(--signal)}
@keyframes settle{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}

/* ---------- centre ---------- */
.centre{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.card{
  background:var(--card);border:1px solid var(--rule);border-radius:5px;
  padding:26px 26px 22px;animation:rise .38s var(--ease) both;
}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.card.leaving{animation:depart .3s var(--ease) forwards}
@keyframes depart{to{opacity:0;transform:translateY(-14px) scale(.985)}}

.eyebrow{
  font-family:var(--mono);font-size:11px;color:var(--slate);
  display:flex;gap:10px;align-items:center;margin-bottom:12px;
}
.eyebrow .tier{border:1px solid var(--rule);border-radius:2px;padding:1px 5px}
.prompt{
  font-family:var(--display);font-weight:500;font-size:27px;line-height:1.22;
  letter-spacing:-.015em;margin:0 0 8px;
}
.help{font-size:14px;color:var(--slate);margin:0 0 20px;max-width:46ch}

.field{width:100%;font:inherit;color:inherit;background:transparent;
  border:0;border-bottom:1.5px solid var(--rule);padding:9px 2px;outline:none}
.field:focus{border-bottom-color:var(--ink)}
.field::placeholder{color:#9AA5A0}
textarea.field{resize:vertical;min-height:80px;border:1.5px solid var(--rule);
  border-radius:4px;padding:11px}
textarea.field:focus{border-color:var(--ink)}

.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.opt{
  font:inherit;font-size:14px;background:transparent;color:inherit;cursor:pointer;
  border:1px solid var(--rule);border-radius:3px;padding:8px 13px;transition:.14s var(--ease);
}
.opt:hover{border-color:var(--slate)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--card)}
.opt:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

.row{display:flex;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap}
.next{
  font:inherit;font-weight:500;font-size:15px;cursor:pointer;
  background:var(--ink);color:var(--card);border:1px solid var(--ink);
  border-radius:3px;padding:9px 20px;
}
.next:disabled{opacity:.32;cursor:not-allowed}
.next:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.ghost{
  font:inherit;font-size:14px;background:transparent;border:0;color:var(--slate);
  cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:4px;
}
.ghost:hover{color:var(--ink)}
.hint{font-family:var(--mono);font-size:11px;color:var(--slate);margin-left:auto}
.err{color:var(--signal);font-size:13px;margin-top:10px;display:none}
.err.show{display:block}

/* ---------- on-deck ---------- */
.ondeck{
  border:1px dashed var(--rule);border-radius:5px;padding:14px 18px;
  font-size:13px;color:var(--slate);
}
.ondeck .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;display:block;margin-bottom:4px}

/* ---------- reconcile ---------- */
.reconcile{
  border:1px solid var(--signal);background:var(--signal-wash);border-radius:5px;
  padding:18px 20px;animation:rise .38s var(--ease) both;
}
.reconcile h3{font-family:var(--display);font-size:17px;font-weight:600;margin:0 0 6px}
.reconcile p{font-size:14px;margin:0 0 14px;color:#1A2E4F}

/* ---------- done ---------- */
.done{text-align:left}
.done h2{font-family:var(--display);font-size:26px;font-weight:600;margin:0 0 10px;letter-spacing:-.015em}
.done p{font-size:15px;color:var(--slate);max-width:48ch}
.readout{font-family:var(--mono);font-size:12px;color:var(--slate);
  border-top:1px solid var(--rule);margin-top:18px;padding-top:14px;line-height:2}

@media (max-width:900px){
  .stage{grid-template-columns:1fr;gap:20px;padding:22px 18px 40px}
  .col{display:none}
  .col.mobile-log{display:flex}
  .prompt{font-size:23px}
  .card{padding:20px 18px 18px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <span class="wordmark">Ledgerline</span>
    <span style="font-size:13px;color:var(--slate)">Setting up your business profile</span>
    <span class="meta" id="counter">0 / 12 core</span>
  </header>
  <div class="progress-rail"><div class="progress-fill" id="fill"></div></div>

  <main class="stage">
    <section class="col" id="colL" aria-label="Recorded answers, left column">
      <div class="col-head">Recorded</div>
    </section>

    <section class="centre" id="centre" aria-live="polite"></section>

    <section class="col" id="colR" aria-label="Recorded answers, right column">
      <div class="col-head">Recorded</div>
    </section>
  </main>
</div>

<script>
const QUESTIONS = [
  { id:"1.1", tier:"core", cost:1, prompt:"What is the name of the business?", type:"text", placeholder:"Business name" },
  { id:"1.1b", tier:"core", cost:1, prompt:"Which country does the business operate in?",
    help:"This affects tax, advertising rules and data protection requirements.",
    type:"text", placeholder:"Country" },
  { id:"1.3", tier:"core", cost:2, prompt:"In a few sentences, what does the business do?",
    type:"longtext", placeholder:"Describe it the way you'd describe it to a friend." },
  { id:"1.4", tier:"core", cost:1, prompt:"What does the business sell?", help:"Select everything that applies.",
    type:"multi", options:["Physical products","Services","Software","Digital products","Subscriptions","Marketplace access"] },
  { id:"1.5", tier:"core", cost:1, prompt:"What stage is the business in right now?",
    type:"single", options:["Idea","Preparing to launch","Recently launched","Operating","Growing","Stable","Declining","Paused"] },
  { id:"1.6", tier:"core", cost:1, prompt:"How many people work in the business, including you?",
    type:"number", placeholder:"0" },
  { id:"2.1", tier:"core", cost:1, prompt:"Is the business online, physical, or both?",
    type:"single", options:["Online only","Physical only","Both"] },
  { id:"4.1", tier:"core", cost:1, prompt:"Does the business make money at the moment?",
    type:"single", options:["Yes","No","Not launched yet","It used to"] },
  { id:"4.1a", tier:"core", cost:1, prompt:"Roughly how much revenue per month?",
    help:"An estimate is fine. I'll mark it as an estimate.",
    type:"money", placeholder:"0", showIf:s => s["4.1"] === "Yes" },
  { id:"4.1n1", tier:"core", cost:2, prompt:"What is missing before you can start selling?",
    type:"longtext", placeholder:"Whatever is standing in the way.",
    showIf:s => s["4.1"] === "No" || s["4.1"] === "Not launched yet" },
  { id:"8.1", tier:"core", cost:1, prompt:"Do you run paid advertising?",
    type:"single", options:["Yes","No","I used to"] },
  { id:"13.2", tier:"core", cost:1, prompt:"What is the single biggest thing stopping growth right now?",
    type:"single", options:["Not enough leads","Low conversion","Weak marketing","Lack of time","Low profit","Cash flow","No clear strategy"] },
  { id:"13.5", tier:"core", cost:2, prompt:"Is there anything you'd never want the business to do, whatever the results?",
    help:"Tone, tactics, platforms, discounting. I'll treat these as hard limits.",
    type:"longtext", placeholder:"Nothing comes to mind is a fine answer." }
];

const state = {};      // id -> display value
const meta  = {};      // id -> { source, estimate }
let idx = 0, side = 0, flagged = false;

const centre = document.getElementById("centre");
const cols = [document.getElementById("colL"), document.getElementById("colR")];

const visible = () => QUESTIONS.filter(q => !q.showIf || q.showIf(state));
const current = () => visible()[idx];

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

function updateCounter(){
  const total = visible().length, done = Math.min(idx, total);
  document.getElementById("counter").textContent = `${done} / ${total} core`;
  document.getElementById("fill").style.width = (done / total * 100) + "%";
}

function render(){
  const q = current();
  updateCounter();
  if (!q) return renderDone();

  const nextQ = visible()[idx + 1];
  centre.innerHTML = `
    <div class="card" id="card">
      <div class="eyebrow"><span>${esc(q.id)}</span><span class="tier">${esc(q.tier)}</span></div>
      <h2 class="prompt">${esc(q.prompt)}</h2>
      ${q.help ? `<p class="help">${esc(q.help)}</p>` : ""}
      <div id="control"></div>
      <p class="err" id="err">Answer this, or choose “I don't know” to move on.</p>
      <div class="row">
        <button class="next" id="next" disabled>Record answer</button>
        <button class="ghost" id="dunno">I don't know</button>
        <span class="hint">Enter to continue</span>
      </div>
    </div>
    ${nextQ ? `<div class="ondeck"><span class="lbl">Next</span>${esc(nextQ.prompt)}</div>` : ""}
  `;
  buildControl(q);
  document.getElementById("next").addEventListener("click", () => submit(false));
  document.getElementById("dunno").addEventListener("click", () => submit(true));
}

function buildControl(q){
  const host = document.getElementById("control");
  const nextBtn = () => document.getElementById("next");

  if (q.type === "text" || q.type === "number" || q.type === "money"){
    host.innerHTML = `<input class="field" id="in" type="${q.type==="text"?"text":"number"}"
      placeholder="${esc(q.placeholder||"")}" autocomplete="off">`;
    const el = document.getElementById("in");
    el.addEventListener("input", () => { nextBtn().disabled = !el.value.trim(); clearErr(); });
    el.addEventListener("keydown", e => { if (e.key === "Enter") submit(false); });
    el.focus();
  }

  if (q.type === "longtext"){
    host.innerHTML = `<textarea class="field" id="in" rows="3" placeholder="${esc(q.placeholder||"")}"></textarea>`;
    const el = document.getElementById("in");
    el.addEventListener("input", () => { nextBtn().disabled = !el.value.trim(); clearErr(); });
    el.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey||e.ctrlKey)) submit(false); });
    el.focus();
  }

  if (q.type === "single" || q.type === "multi"){
    host.innerHTML = `<div class="opts" id="opts">` + q.options.map(o =>
      `<button class="opt" type="button" aria-pressed="false" data-v="${esc(o)}">${esc(o)}</button>`).join("") + `</div>`;
    host.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (q.type === "single"){
          host.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-pressed","false"));
          btn.setAttribute("aria-pressed","true");
          clearErr();
          setTimeout(() => submit(false), 130);
        } else {
          btn.setAttribute("aria-pressed", btn.getAttribute("aria-pressed") === "true" ? "false" : "true");
          nextBtn().disabled = !host.querySelector('.opt[aria-pressed="true"]');
          clearErr();
        }
      });
    });
  }
}

function readValue(q){
  if (["text","number","money","longtext"].includes(q.type)){
    const el = document.getElementById("in");
    return el && el.value.trim() ? el.value.trim() : null;
  }
  const picked = [...document.querySelectorAll('.opt[aria-pressed="true"]')].map(b => b.dataset.v);
  return picked.length ? picked.join(", ") : null;
}

function clearErr(){ const e = document.getElementById("err"); if (e) e.classList.remove("show"); }

function submit(unknown){
  const q = current();
  const value = unknown ? null : readValue(q);
  if (!unknown && !value){ document.getElementById("err").classList.add("show"); return; }

  state[q.id] = value;
  meta[q.id] = { source: unknown ? "unknown" : "owner", estimate: q.type === "money" };

  const card = document.getElementById("card");
  if (card) card.classList.add("leaving");

  setTimeout(() => {
    pushChip(q, value, unknown);
    idx++;
    render();
    maybeReconcile();
  }, 240);
}

function pushChip(q, value, unknown){
  const col = cols[side % 2];
  side++;
  const chip = document.createElement("button");
  chip.className = "chip";
  chip.dataset.qid = q.id;
  const shown = unknown ? "Not known" : (value.length > 68 ? value.slice(0,68) + "…" : value);
  const tag = unknown ? "gap · will revisit"
            : meta[q.id].estimate ? "owner · estimate" : "owner · stated";
  chip.innerHTML = `
    <span class="q">${esc(q.prompt)}</span>
    <span class="a">${esc(shown)}</span>
    <span class="tag"><span class="dot ${unknown ? "thin" : ""}"></span>${esc(q.id)} · ${esc(tag)}</span>`;
  chip.addEventListener("click", () => alert(`Reopen ${q.id}\n\nIn the real product this returns the question to the centre, keeps the old value in history, and records why it changed.`));
  col.appendChild(chip);
}

function maybeReconcile(){
  if (flagged) return;
  const growing = ["Growing","Stable","Operating"].includes(state["1.5"]);
  const noRevenue = state["4.1"] === "No" || state["4.1"] === "Not launched yet";
  if (!(growing && noRevenue)) return;
  flagged = true;

  cols.forEach(c => c.querySelectorAll(".chip").forEach(ch => {
    if (ch.dataset.qid === "1.5" || ch.dataset.qid === "4.1") ch.classList.add("flag");
  }));

  const box = document.createElement("div");
  box.className = "reconcile";
  box.innerHTML = `
    <h3>Help me reconcile these two</h3>
    <p>You said the business is <strong>${esc(state["1.5"]||"")}</strong>, but also that it isn't making money yet.
       Both can be true — I'd rather ask than assume.</p>
    <div class="row" style="margin-top:0">
      <button class="next" id="rec1">Both are right</button>
      <button class="ghost" id="rec2">Let me fix one</button>
    </div>`;
  centre.appendChild(box);
  box.querySelector("#rec1").addEventListener("click", () => {
    box.remove();
    cols.forEach(c => c.querySelectorAll(".chip.flag").forEach(ch => {
      ch.classList.remove("flag");
      ch.querySelector(".tag").lastChild.textContent = ` ${ch.dataset.qid} · owner · confirmed`;
    }));
  });
  box.querySelector("#rec2").addEventListener("click", () => {
    box.remove();
    alert("In the real product this returns both questions to the centre, one after the other.");
  });
}

function renderDone(){
  const answered = Object.values(state).filter(v => v !== null).length;
  const gaps = Object.values(state).filter(v => v === null).length;
  centre.innerHTML = `
    <div class="card done">
      <h2>That's enough to start.</h2>
      <p>I have what I need for a first read on the business. I'll keep asking as I go — the deeper
         questions are easier to answer once you've seen what I do with these.</p>
      <div class="readout">
        answered &nbsp;<strong>${answered}</strong><br>
        gaps to revisit &nbsp;<strong>${gaps}</strong><br>
        profile confidence &nbsp;<strong>${gaps > 2 ? "moderate" : "good"}</strong><br>
        next &nbsp;<strong>deciding how carefully to move</strong>
      </div>
    </div>`;
}

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && document.activeElement === document.body) submit(false);
});

render();
</script>
</body>
</html>
