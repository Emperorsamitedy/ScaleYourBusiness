<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ledgerline — Diagnosis report (data-driven)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ember.css">
</head>
<body>
<div class="app">
<aside class="rail">
  <div class="wordmark">Ledgerline</div>
  <nav class="nav">
    <a href="#" class="on"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 17h14M6 13V8.5M10 13V4M14 13V7"/></svg>Diagnosis</a>
    <a href="#"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 3h7l3 3v11H5zM12 3v3h3M8 10h4M8 13h4"/></svg>Profile</a>
    <a href="#"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 10s2.8-5 7.5-5 7.5 5 7.5 5-2.8 5-7.5 5-7.5-5-7.5-5z"/><circle cx="10" cy="10" r="2"/></svg>Watching</a>
    <a href="#"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 3h6v6H3zM11 3h6v6h-6zM3 11h6v6H3zM11 11h6v6h-6z"/></svg>Modules</a>
  </nav>
  <div class="foot"><span class="av" id="av">ES</span><div><div style="font-size:14px" id="owner">Eszter</div><small id="biz">SZÖRP KFT.</small></div></div>
</aside>

<main class="main" id="root">
  <div id="ink"></div>

  <div class="kicker">Diagnosis · 26 August 2026</div>
  <h1 id="h1">Here's what I can see.</h1>
  <p class="lede" id="lede"></p>

  <div class="monthbar">
    <div class="mb-head">
      <span class="l"><span style="color:var(--dim)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 16V9M8 16V5M12 16v-4M16 16v-8"/></svg></span><span class="label">Your month, in one bar</span></span>
      <span class="cl" id="revline"></span>
    </div>
    <div class="bar" id="bar"></div>
    <div class="brk" style="height:34px"><div class="line" id="brkline"></div></div>

    <div class="leakbox">
      <span class="ic"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 2.5s5 5.4 5 9a5 5 0 0 1-10 0c0-3.6 5-9 5-9z"/></svg></span>
      <div>
        <div class="n"><span data-anno="leak-figure" id="leak"></span><span class="u">HUF / month</span></div>
        <div class="t" id="leaksub"></div>
      </div>
      <div class="row" style="margin:0 0 0 auto">
        <button class="btn p">Start with the biggest</button>
        <button class="btn q">Download as PDF</button>
      </div>
    </div>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="sec"><h3 style="color:var(--ember)" id="f1head"></h3><span class="ln"></span></div>
  <div class="focal">
    <h2 id="f1title"></h2>
    <p style="color:var(--mut);max-width:58ch;margin:0" id="f1body"></p>
    <div class="bars" id="bars" style="margin-top:26px"></div>
    <div class="note">
      <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="var(--ember)" stroke-width="1.6" stroke-linecap="round" style="flex:none;margin-top:2px"><circle cx="10" cy="10" r="7.5"/><path d="M10 6.5v4M10 13.5h.01"/></svg>
      <span id="f1note"></span>
    </div>
    <div class="row">
      <button class="btn p">See what to do about it</button>
      <button class="btn g">Show me the evidence</button>
      <button class="src" style="margin-left:auto"><span class="dot der"></span><span id="f1src"></span><span class="tip">offers.* · owner · stated · 0.75 · margin derived 0.68</span></button>
    </div>
  </div>

  <div class="sec"><h3>Also costing you</h3><span class="ln"></span></div>
  <div id="others"></div>

  <div class="sec"><h3>What I still don't know</h3><span class="ln"></span></div>
  <div class="two">
    <div class="card" data-anno="gaps-block" id="gaps"></div>
    <div class="card">
      <div class="label">How complete your profile is</div>
      <div style="font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:-.02em;margin:10px 0 4px" id="conf"></div>
      <div style="color:var(--mut);font-size:14px" id="confsub"></div>
      <div class="blt" id="blt"></div>
    </div>
  </div>
</main>
</div>

<nav class="switch" id="switch" aria-label="Example businesses"></nav>
<div class="marks" id="marks"></div>

<script type="module">
import { buildAnnotations, renderAnnotations, fmt } from '/anno-engine.js';

/* Three real-shaped businesses. Same page, same rules — different marks. */
const REPORTS = {
  szorp: {
    label: "Szörp Kft. · syrup maker", owner: "Eszter", initials: "ES", biz: "SZÖRP KFT.",
    revenue: 4_500_000, cost_share: 77, fixed_share: 12, keep_share: 11,
    leak_monthly: 520_000, margin_stated: 40, margin_actual: 23,
    orders: 310, orders_label: "orders", trend_pct: 9, aov: 14_500,
    offers: [
      { name: "Gift box", margin: 61, share: 9 },
      { name: "Winter spice 0.5L", margin: 44, share: 11 },
      { name: "Sampler 3×0.1L", margin: 38, share: 5 },
      { name: "Szörp 1L", margin: 31, share: 14 },
      { name: "Szörp 0.5L", margin: 18, share: 61 },
    ],
    time_finding_hours: 16, time_finding_what: "Instagram DMs",
    findings: [
      { t: "You haven't raised prices in 26 months.", s: "Your costs rose 31% over the same period. Your prices didn't move.", amt: "210 000", unit: "HUF/mo", hot: true },
      { t: "Instagram DMs eat four hours a week for 6% of sales.", s: "The slowest channel to serve is also the smallest.", amt: "16", unit: "hours/mo", time: true },
    ],
    gaps: [
      { n: "Monthly ad spend", w: "Without it I can't tell you whether marketing pays for itself.", t: "1 min" },
      { n: "Supplier lead times", w: "Changes how much stock you should hold before December.", t: "2 min" },
      { n: "Repeat customer rate", w: "Decides whether finding 3 is worth acting on at all.", t: "1 min" },
    ],
    confidence: "Good", core: [27, 27], important: [9, 14], deep: [1, 12],
  },

  fenyes: {
    label: "Fényes Studio · design agency", owner: "Márton", initials: "MK", biz: "FÉNYES STUDIO",
    revenue: 2_800_000, cost_share: 41, fixed_share: 34, keep_share: 25,
    leak_monthly: 240_000, margin_stated: null, margin_actual: 59,
    orders: 18, orders_label: "projects", trend_pct: -6, aov: 155_000,
    offers: [
      { name: "Brand identity", margin: 51, share: 12 },
      { name: "Audits", margin: 61, share: 9 },
      { name: "Workshops", margin: 39, share: 21 },
      { name: "Monthly retainer", margin: 22, share: 58 },
    ],
    time_finding_hours: 34, time_finding_what: "revisions",
    findings: [
      { t: "Retainer clients get 40% more hours than they pay for.", s: "Scope has crept on every one of the four retainers since March.", amt: "34", unit: "hours/mo", time: true },
    ],
    gaps: [
      { n: "Hourly cost per designer", w: "Without it every project margin here is an estimate.", t: "2 min" },
      { n: "Utilisation rate", w: "Tells us whether you need more clients or fewer.", t: "1 min" },
      { n: "Average project length", w: "Changes what a retainer should cost.", t: "1 min" },
      { n: "Churn last 12 months", w: "Decides whether to fix retainers or replace them.", t: "2 min" },
      { n: "Ad spend", w: "You may not need any — but I can't say yet.", t: "1 min" },
    ],
    confidence: "Moderate", core: [24, 27], important: [4, 14], deep: [0, 12],
  },

  kave: {
    label: "Kávé & Co · café", owner: "Júlia", initials: "JN", biz: "KÁVÉ & CO",
    revenue: 3_200_000, cost_share: 62, fixed_share: 32, keep_share: 6,
    leak_monthly: 185_000, margin_stated: 55, margin_actual: 31,
    orders: 2_140, orders_label: "covers", trend_pct: 3, aov: 1_495,
    offers: [
      { name: "Pastry", margin: 64, share: 18 },
      { name: "Filter coffee", margin: 58, share: 22 },
      { name: "Espresso drinks", margin: 44, share: 46 },
      { name: "Lunch plates", margin: 21, share: 14 },
    ],
    time_finding_hours: 6, time_finding_what: "cash-ups",
    findings: [
      { t: "Lunch plates lose money once staff time is counted.", s: "They occupy the kitchen for two hours and return 21%.", amt: "95 000", unit: "HUF/mo", hot: true },
    ],
    gaps: [{ n: "Waste per week", w: "Pastry margin is only as good as what you don't throw out.", t: "1 min" }],
    confidence: "Good", core: [27, 27], important: [11, 14], deep: [2, 12],
  },
};

const $ = (id) => document.getElementById(id);
const money = (n) => fmt(n);
const byMargin = (r) => [...r.offers].sort((a, b) => b.margin - a.margin);

function render(key) {
  const r = REPORTS[key];
  const sorted = byMargin(r), best = sorted[0], worst = sorted.at(-1);
  const maxM = best.margin;

  $('owner').textContent = r.owner; $('biz').textContent = r.biz; $('av').textContent = r.initials;
  $('lede').textContent = r.findings.length + 1 === 1
    ? "One thing is costing you money."
    : `${['One','Two','Three','Four'][r.findings.length]} things are costing you money. The first one is worth more than the rest together.`;
  $('revline').textContent = `${money(r.revenue)} HUF revenue · august`;

  // month bar
  const keep = Math.round(r.revenue * r.keep_share / 100);
  $('bar').innerHTML = `
    <div class="seg s1" data-anno="cost-block" style="flex:${r.cost_share};animation-delay:.05s">
      <span class="st">Materials &amp; making · ${r.cost_share}%</span><span class="sv">${money(r.revenue * r.cost_share / 100)}</span></div>
    <div class="seg s2" style="flex:${r.fixed_share};animation-delay:.15s">
      <span class="st">Fixed ${r.fixed_share}%</span><span class="sv">${money(r.revenue * r.fixed_share / 100)}</span></div>
    <div class="seg s3" data-anno="keep-block" style="flex:${r.keep_share};animation-delay:.25s">
      <span class="st">You keep</span><span class="sv">${money(keep)}</span></div>`;
  $('brkline').style.width = (r.leak_monthly / r.revenue * 100).toFixed(1) + '%';
  $('leak').textContent = money(r.leak_monthly);
  $('leaksub').textContent = `leaking out of that first block · ${(r.leak_monthly / r.revenue * 100).toFixed(1)}% of everything you take`;

  // tiles
  const up = r.trend_pct >= 0;
  const arrow = (u) => u ? '<path d="M10 16V4M5.5 8.5 10 4l4.5 4.5"/>' : '<path d="M10 4v12M5.5 11.5 10 16l4.5-4.5"/>';
  const ico = (d) => `<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const statedRow = r.margin_stated == null
    ? `<div class="tsub">you've never told me a figure</div>`
    : `<div class="tsub">you told me <span data-anno="margin-stated">${r.margin_stated}%</span></div>`;
  $('tiles').innerHTML = `
    <div class="tile hot">
      <div class="th"><span class="ti">${ico('<path d="M6.5 6.5h.01M13.5 13.5h.01M15 5 5 15"/>')}</span><span class="cl">Gross margin</span></div>
      <div class="tv"><span class="v">${r.margin_actual}%</span></div>
      ${statedRow}
      <div class="dual">
        ${r.margin_stated == null ? '' : `<div class="d"><span style="width:52px">stated</span><span class="dt"><span class="df" style="width:${r.margin_stated}%;background:rgba(255,255,255,.28)"></span></span><span>${r.margin_stated}%</span></div>`}
        <div class="d"><span style="width:52px">actual</span><span class="dt"><span class="df" style="width:${r.margin_actual}%;background:linear-gradient(90deg,var(--ember-deep),var(--ember))"></span></span><span style="color:var(--ember)">${r.margin_actual}%</span></div>
      </div>
    </div>
    <div class="tile">
      <div class="th"><span class="ti">${ico('<path d="M3 5h2l1.6 8.4a1.5 1.5 0 0 0 1.5 1.2h6.3a1.5 1.5 0 0 0 1.5-1.2L17 8H6"/><circle cx="8.5" cy="17" r="1"/><circle cx="15" cy="17" r="1"/>')}</span><span class="cl">${r.orders_label}</span></div>
      <div class="tv"><span class="v">${money(r.orders)}<span class="sm"> /mo</span></span></div>
      <div class="tsub">≈ ${money(r.aov)} HUF each</div>
      <div class="tviz">${[46,58,41,66,59,78,92].map((h,i)=>`<span class="b${i===6?' hot':''}" style="height:${h}%;animation-delay:${.05*i}s"></span>`).join('')}</div>
    </div>
    <div class="tile">
      <div class="th"><span class="ti">${ico('<path d="M3 14 8 9l3 3 6-6"/><path d="M13 6h4v4"/>')}</span><span class="cl">Revenue trend</span></div>
      <div class="tv"><span class="v" data-anno="trend-value" style="color:${up?'var(--settled)':'var(--err)'}">${up?'+':''}${r.trend_pct}%</span>
        <span class="chip ${up?'up':'dn'}">${ico(arrow(up))}since June</span></div>
      <div class="tsub">${up?'steady — not seasonal noise':'three months of slow decline'}</div>
      <svg viewBox="0 0 200 34" preserveAspectRatio="none" style="width:100%;height:34px;margin-top:14px" aria-hidden="true">
        <path d="${up?'M0,24 L36,26 L72,21 L108,17 L144,14 L199,5':'M0,8 L36,11 L72,10 L108,17 L144,19 L199,26'}" fill="none" stroke="${up?'#34d399':'#ff7a72'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="199" cy="${up?5:26}" r="3" fill="${up?'#34d399':'#ff7a72'}"/></svg>
    </div>
    <div class="tile">
      <div class="th"><span class="ti">${ico('<path d="M10 2.5 4 5v4.5c0 3.6 2.5 6.8 6 8 3.5-1.2 6-4.4 6-8V5z"/><path d="M7.5 10 9.5 12l3.5-3.5"/>')}</span><span class="cl">Profile confidence</span></div>
      <div class="tv"><span class="v">${r.confidence}</span><span class="chip neu">${r.gaps.length} gaps</span></div>
      <div class="tsub">${r.core[0]} of ${r.core[1]} core answered</div>
      <div class="ring">
        <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true">
          <circle cx="26" cy="26" r="21" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="5"/>
          <circle cx="26" cy="26" r="21" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"
            stroke-dasharray="${(132*r.core[0]/r.core[1]).toFixed(0)} 132" transform="rotate(-90 26 26)"/></svg>
        <div style="font-family:var(--mono);font-size:11px;line-height:1.9;color:var(--dim)">
          core <span style="color:var(--settled)">${r.core[0]}/${r.core[1]}</span><br>important <span style="color:var(--ember)">${r.important[0]}/${r.important[1]}</span></div>
      </div>
    </div>`;

  // lead finding
  const gap = (best.margin / worst.margin).toFixed(1);
  $('f1head').textContent = `Finding 1 — worth ${money(r.leak_monthly - (r.findings[0]?.hot ? 210000 : 0) > 0 ? Math.round(r.leak_monthly * .6) : r.leak_monthly)} HUF a month`;
  $('f1title').textContent = worst.share >= 30
    ? "Your best-selling line is your least profitable."
    : `${worst.name} earns less than everything else you sell.`;
  $('f1body').textContent = `${worst.name} is ${worst.share}% of everything you sell and returns the thinnest margin of the ${r.offers.length}. ${best.name} earns ${gap}× as much per unit.`;
  $('f1note').textContent = `The bar you sell most of is the shortest one — ${best.name} returns ${best.margin}% against ${worst.name}'s ${worst.margin}%.`;
  $('f1src').textContent = `${r.offers.length} products · 3 sources`;
  $('bars').innerHTML = sorted.map((o, i) => {
    const hi = o.name === worst.name;
    const anno = hi ? ' data-anno="offer-worst-value"' : (i === 0 ? ' data-anno="offer-best-value"' : '');
    const rowAnno = i === 1 ? ' data-anno="offer-second-row"' : '';
    return `<div class="brow${hi?' hi':''}"${rowAnno}><span class="bname">${o.name}</span>
      <span class="btrack"><span class="bfill" style="--w:${(o.margin/maxM*100).toFixed(0)}%;animation-delay:${.05*i}s"></span></span>
      <span class="bval"${anno}>${o.margin}%</span></div>`;
  }).join('');

  // other findings
  $('others').innerHTML = r.findings.map((f, i) => `
    <div class="fr"><span class="fno">0${i+2}</span>
      <div><h3>${f.t}</h3><div class="sub">${f.s}</div></div>
      <span class="amt"${f.time?' data-anno="time-figure"':''} style="${f.hot?'color:var(--ember)':''}">${f.amt} <span style="font-size:13px;color:var(--mut);font-weight:400">${f.unit}</span></span>
    </div>`).join('');

  // gaps
  $('gaps').innerHTML = r.gaps.map((g, i) => `
    <div class="gap"${i===r.gaps.length-1?' style="border-bottom:0"':''}><span class="src" style="cursor:default"><span class="dot gap"></span></span>
      <div class="g"><div class="n">${g.n}</div><div class="w">${g.w}</div></div>
      <button class="btn q">Answer · ${g.t}</button></div>`).join('');
  $('conf').textContent = r.confidence;
  $('confsub').textContent = r.findings.length > 1 ? "Enough to trust findings 1 and 2." : "Enough to act on finding 1.";
  $('blt').innerHTML = [['Core',r.core,''],['Important',r.important,'part'],['Deep',r.deep,'low']]
    .map(([n,[a,b],c]) => `<div class="r"><span class="n">${n}</span><span class="t"><span class="f ${c}" style="--w:${(a/b*100).toFixed(0)}%"></span></span><span class="p">${a}/${b}</span></div>`).join('');

  // ── the marks this report earned ──
  const marks = buildAnnotations(r);
  const draw = () => renderAnnotations(marks, $('ink'), $('root'));
  requestAnimationFrame(() => { draw(); setTimeout(draw, 260); });
  if (document.fonts?.ready) document.fonts.ready.then(draw);
  window.__redraw = draw;
  $('marks').innerHTML = `<b style="color:var(--mut)">${marks.length} marks earned</b><br>` +
    marks.map(m => `· ${m.kind} → ${m.anchor}`).join('<br>');
}

$('switch').innerHTML = Object.entries(REPORTS)
  .map(([k, v]) => `<button data-k="${k}">${v.label}</button>`).join('');
$('switch').addEventListener('click', e => {
  const b = e.target.closest('[data-k]'); if (!b) return;
  [...$('switch').children].forEach(x => x.setAttribute('aria-current', String(x === b)));
  render(b.dataset.k);
});
$('switch').firstElementChild.setAttribute('aria-current', 'true');
let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => window.__redraw?.(), 120); });
render('szorp');
</script>
</body>
</html>
